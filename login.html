<!doctype html>
<html lang="en">
  <head>
    <link rel="logo" href="logo.png.jpeg" />
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Invocify</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="nav-logo">
        <a href="index.html"
        <img src="logo.png.jpeg"alt="Invoicify logo"width="140"height="40"/></a>
      </div>
      </nav>
    </header>
    <main>
      <section class="login-section">
        <div class="login-card">
          <h1>Welcome Back</h1>
          <p>Login to your invoicify account </p>
          <form>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email"placeholder="Enter your email"></div>
              <div class="form-group">
                <label>Password</label>
                <input type="password"placeholder="Enter your password">
                <a href="#">forget password?</a></div>
                <button type="submit" class="btn-primary">Login</button>
                <p>Don't have an account?<a href="signup.html">Sign Up</a></p>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
